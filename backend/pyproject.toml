[project]
name = "mycv-backend"
version = "0.1.0"
description = "Django backend for the mycv interactive CV"
readme = "../README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "django-environ>=0.12",
    "django-filter>=24.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "pillow>=11.0",
    "django-axes>=8.0",
    "weasyprint>=63.0",
    "segno>=1.6.0",
    "django-csp>=3.8",
    "sentry-sdk[django]>=2.18",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "bandit>=1.7",
    "safety>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "RUF", "S", "N", "C4", "SIM"]
# RUF012: Django Meta classes and ModelAdmin attributes idiomatically use
# mutable class-level tuples/dicts; annotating with ClassVar is verbose noise.
ignore = ["S101", "DJ001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/test_*.py" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["environ.*", "factory.*", "weasyprint.*", "segno.*", "sentry_sdk.*", "pythonjsonlogger.*", "csp.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers --cov=apps --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py", "*/apps.py"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]
