name: mycv

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycv
      POSTGRES_USER: mycv
      POSTGRES_PASSWORD: mycv
      TZ: Europe/Zurich
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycv -d mycv"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Port not exposed to host — backend connects via Docker network.
    # Uncomment to reach DB from host tools (e.g. psql, TablePlus):
    # ports:
    #   - "127.0.0.1:5433:5432"

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://mycv:mycv@db:5432/mycv
      SECRET_KEY: dev-only-not-secret
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      TZ: Europe/Zurich
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py load_cv_seed &&
             uv run python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE: /api
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
  backend_static:
  backend_media:
  frontend_node_modules:
