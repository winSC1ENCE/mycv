name: Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mycv-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mycv-frontend

jobs:
  # ── 1. Quality gate (mirrors ci.yml; runs on the tagged commit) ──────────
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Backend — install, lint, test
        working-directory: backend
        run: |
          uv sync --frozen 2>/dev/null || uv sync
          uv run ruff check .
          uv run mypy .
          uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, lint, test, build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build

  # ── 2. Build & push images to GHCR ──────────────────────────────────────
  build_push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. SSH deploy (skipped until DEPLOY_HOST var is set) ──────
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build_push
    # Set the DEPLOY_HOST repository variable to activate this job.
    if: vars.DEPLOY_HOST != ''
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/mycv
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter "until=24h"
            echo "Deploy complete — $(date -u)"

      - name: Smoke test
        run: |
          sleep 15
          curl --fail --max-time 10 \
            "https://${{ vars.DEPLOY_HOST }}/api/health/" \
            | grep '"status":"ok"'
