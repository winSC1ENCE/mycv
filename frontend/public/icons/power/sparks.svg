<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" preserveAspectRatio="xMidYMid">
  <defs>
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd500" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffd500" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffd500" stop-opacity="0" />
    </radialGradient>
    <path
      id="mini-bolt"
      d="M-5 -16 L4 -16 L-1 -2 L6 -2 L-7 18 L-2 0 L-9 0 Z"
    />
  </defs>

  <!-- Faint electric-blue energy traces -->
  <g fill="none" stroke="#2f6bff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.14">
    <path d="M-10 90 Q 90 60 150 110 T 340 90" />
    <path d="M120 420 Q 220 380 260 430 T 500 400" />
    <path d="M-20 300 Q 60 330 100 290 T 260 300" />
  </g>

  <!-- Glowing spark blobs -->
  <g>
    <circle cx="70" cy="60" r="16" fill="url(#spark-glow)" />
    <circle cx="340" cy="40" r="11" fill="url(#spark-glow)" />
    <circle cx="230" cy="150" r="9" fill="url(#spark-glow)" />
    <circle cx="60" cy="230" r="13" fill="url(#spark-glow)" />
    <circle cx="410" cy="200" r="18" fill="url(#spark-glow)" />
    <circle cx="300" cy="320" r="10" fill="url(#spark-glow)" />
    <circle cx="130" cy="360" r="15" fill="url(#spark-glow)" />
    <circle cx="420" cy="410" r="12" fill="url(#spark-glow)" />
    <circle cx="20" cy="420" r="9" fill="url(#spark-glow)" />
  </g>

  <!-- Scattered light-yellow bolts, irregular sizes/rotations (comic-confetti style) -->
  <g fill="#ffe985" fill-opacity="0.4">
    <use href="#mini-bolt" transform="translate(150 90)  rotate(-12) scale(1.3)" />
    <use href="#mini-bolt" transform="translate(380 130) rotate(18)  scale(0.9)" />
    <use href="#mini-bolt" transform="translate(40 170)  rotate(-20) scale(1.1)" />
    <use href="#mini-bolt" transform="translate(260 250) rotate(10)  scale(0.8)" />
    <use href="#mini-bolt" transform="translate(430 300) rotate(-16) scale(1.2)" />
    <use href="#mini-bolt" transform="translate(180 400) rotate(22)  scale(1)" />
    <use href="#mini-bolt" transform="translate(350 440) rotate(-8)  scale(0.75)" />
    <use href="#mini-bolt" transform="translate(90 40)   rotate(14)  scale(0.7)" />
  </g>
</svg>
