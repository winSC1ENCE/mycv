<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid">
  <g fill="#0a0a0a">
    <!-- Big signature spots: scale anchors -->
    <ellipse cx="90"  cy="110" rx="48" ry="34" transform="rotate(18 90 110)"/>
    <ellipse cx="430" cy="220" rx="56" ry="38" transform="rotate(-22 430 220)"/>
    <ellipse cx="190" cy="430" rx="44" ry="32" transform="rotate(35 190 430)"/>

    <!-- Medium spots -->
    <ellipse cx="300" cy="60"  rx="22" ry="16" transform="rotate(-15 300 60)"/>
    <ellipse cx="520" cy="430" rx="28" ry="20" transform="rotate(12 520 430)"/>
    <ellipse cx="60"  cy="320" rx="20" ry="14" transform="rotate(-40 60 320)"/>
    <ellipse cx="380" cy="510" rx="24" ry="17" transform="rotate(20 380 510)"/>

    <!-- Small confetti spots -->
    <ellipse cx="540" cy="90"  rx="8"  ry="6"  transform="rotate(40 540 90)"/>
    <ellipse cx="270" cy="280" rx="10" ry="7"  transform="rotate(-30 270 280)"/>
  </g>
</svg>
