<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="tower-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2f6bff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#tower-glow)" />

  <!-- sagging power cables reaching off the frame -->
  <g stroke="#0b1030" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M4 44 Q 13 39 21 44" />
    <path d="M43 44 Q 51 39 60 44" />
  </g>

  <!-- pylon silhouette -->
  <polygon points="32,7 43,54 36,54 33,29 31,29 28,54 21,54" fill="#0b1030" />
  <line x1="19" y1="25" x2="45" y2="25" stroke="#0b1030" stroke-width="4.5" stroke-linecap="round" />
  <line x1="14" y1="44" x2="50" y2="44" stroke="#0b1030" stroke-width="4.5" stroke-linecap="round" />

  <!-- insulators -->
  <circle cx="19" cy="25" r="2.6" fill="#ffd500" />
  <circle cx="45" cy="25" r="2.6" fill="#ffd500" />
  <circle cx="14" cy="44" r="2.6" fill="#ffd500" />
  <circle cx="50" cy="44" r="2.6" fill="#ffd500" />
</svg>
