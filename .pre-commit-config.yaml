repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-q", "-c", "backend/pyproject.toml", "-r", "backend/apps", "backend/config"]
        files: ^backend/.*\.py$
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        language: system
        files: ^backend/.*\.py$
        entry: bash -c 'docker compose run --rm --no-deps -T backend uv run mypy .' --
        pass_filenames: false

      - id: frontend-prettier
        name: prettier (frontend)
        language: system
        files: ^frontend/.*\.(ts|vue|css|json|html)$
        entry: bash -c 'cd frontend && npx prettier --write "${@#frontend/}"' --

      - id: frontend-eslint
        name: eslint (frontend)
        language: system
        files: ^frontend/src/.*\.(ts|vue)$
        entry: bash -c 'cd frontend && npx eslint --max-warnings 0 "${@#frontend/}"' --
